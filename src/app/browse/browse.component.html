<ActionBar class="action-bar">
  <NavigationButton visibility="hidden"></NavigationButton>

  <GridLayout columns="50, *">

    <Label
      class="fas"
      text="&#xf0c9;"
      (tap)="onDrawerButtonTap()">
    </Label>

    <Label
      class="action-bar-title"
      text="Favoritos"
      col="1">
    </Label>

  </GridLayout>
</ActionBar>

<StackLayout padding="20">

  <Label
    text="Mis favoritos"
    class="h1">
  </Label>

  <ListView [items]="favorites">

    <ng-template let-item="item">

      <StackLayout padding="10">

        <Label
          [text]="item.name"
          class="h2">
        </Label>

        <Button
          text="Leer ahora"
          (tap)="readNow(item)">
        </Button>

      </StackLayout>

    </ng-template>

  </ListView>

</StackLayout>
